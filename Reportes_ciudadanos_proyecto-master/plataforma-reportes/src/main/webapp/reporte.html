<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Reporte Ciudadano</title>
    <!-- Enlace a tu hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="form-container">
    <h2>Registrar Nuevo Reporte</h2>

    <!-- El action debe coincidir con el mapeo de tu Servlet -->
    <form action="CrearReporteServlet" method="POST">

        <div class="form-group">
            <label for="titulo">Título del Reporte:</label>
            <input type="text" id="titulo" name="titulo" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción del problema:</label>
            <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione una opción...</option>
                <option value="infraestructura">Infraestructura</option>
                <option value="seguridad">Seguridad</option>
                <option value="movilidad">Movilidad y Transporte</option>
                <option value="medio_ambiente">Medio Ambiente</option>
            </select>
        </div>

        <div class="form-group">
            <label for="latitud">Latitud:</label>
            <input type="text" id="latitud" name="latitud" placeholder="Ej: 4.6097" required>
        </div>

        <div class="form-group">
            <label for="longitud">Longitud:</label>
            <input type="text" id="longitud" name="longitud" placeholder="Ej: -74.0817" required>
        </div>

        <button type="submit">Enviar Reporte</button>
    </form>
</div>

<!-- Enlace a tu script de lógica frontend -->
<script src="app.js"></script>
</body>
</html>
