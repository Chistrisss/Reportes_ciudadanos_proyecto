<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Reporte Ciudadano</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px;">
<div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="color: #2c3e50;">Registrar Problema en el Barrio</h2>
    <form action="reporte" method="post">
        <div style="margin-bottom: 15px;">
            <label>Título del reporte:</label><br>
            <input type="text" name="titulo" style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Barrio (Ej. Castilla, Suba, Kennedy):</label><br>
            <input type="text" name="barrio" style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Descripción detallada:</label><br>
            <textarea name="descripcion" rows="4" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px;">Enviar Reporte</button>
    </form>
</div>
</body>
</html>
